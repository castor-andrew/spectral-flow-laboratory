<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#071216;color:#dcebe5;font:13px monospace}h1{margin:22px 28px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 20px 20px}.card{background:#102128;border:1px solid #28444c;padding:8px}.card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.card p{margin:8px 2px 2px;color:#d7ff45}</style></head><body><h1>Ten regenerated flows · fixed camera · equal elapsed time</h1><div class="grid"><script>for(let i=0;i<10;i++)document.write(`<div class="card"><img src="flow-${String(i).padStart(2,'0')}.png"><p id="p${i}">Flow ${i+1}</p></div>`)</script></div></body></html>
